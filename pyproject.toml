[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "maud-qwen"
version = "0.2.0"
description = "Reproducible agreement-held-out MAUD evaluation and Qwen3-8B QLoRA experiments"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["numpy==2.2.6", "scipy==1.15.3", "scikit-learn==1.7.2"]

[project.urls]
Repository = "https://github.com/intelligent-iterations/maud-qwen"
Issues = "https://github.com/intelligent-iterations/maud-qwen/issues"

[project.optional-dependencies]
test = ["pytest==9.0.3", "torch==2.14.0", "transformers==4.57.1"]
train = [
  "torch==2.14.0", "transformers==4.57.1", "peft==0.17.1",
  "accelerate==1.10.1", "bitsandbytes==0.48.1", "mlflow==3.4.0",
  "huggingface-hub==0.35.3", "tokenizers==0.22.2", "safetensors==0.8.0rc1"
]

[project.scripts]
maud-qwen = "maud_qwen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
